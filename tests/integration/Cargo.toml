[package]
name = "ecphoria-integration-tests"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

# Empty lib to satisfy Cargo; all tests are in tests/*.rs
[lib]
name = "ecphoria_integration_tests"
path = "src/lib.rs"

[features]
default = ["agentic", "llm-proxy"]
# Mirrors the server's features so `--no-default-features` exercises the memory-only build rather
# than failing on routes that build does not mount.
agentic = [
    "ecphoria-core/agentic",
    "ecphoria-gateway/agentic",
    "ecphoria-cluster/agentic",
]
llm-proxy = ["ecphoria-gateway/llm-proxy"]

[dev-dependencies]
ecphoria-core.workspace = true
ecphoria-gateway = { workspace = true, default-features = false }
ecphoria-cluster.workspace = true

tokio.workspace = true
axum.workspace = true
tower = { workspace = true, features = ["util"] }
serde_json.workspace = true
toml.workspace = true
jsonwebtoken = "11"
tempfile.workspace = true
