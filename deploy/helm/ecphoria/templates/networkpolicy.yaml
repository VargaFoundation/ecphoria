{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecphoria.fullname" . }}
  labels:
    {{- include "ecphoria.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ecphoria.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    # Intra-fleet pod-to-pod: peers reach each other's HTTP (shard proxy), PG, gRPC and Raft ports.
    - from:
        - podSelector:
            matchLabels:
              {{- include "ecphoria.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8432 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 9432 }
        - { protocol: TCP, port: 9433 }
    # HTTP API (:8432) from external sources — restricted to `httpFrom`, or from anywhere if empty.
    # PG/gRPC/Raft are deliberately NOT listed here, so they are only reachable intra-fleet.
    - ports:
        - { protocol: TCP, port: 8432 }
      {{- with .Values.networkPolicy.httpFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  # Egress is opt-in and, once on, **default-deny**: naming a rule means everything unnamed is
  # blocked. That is the point — a memory server that can only reach DNS, its peers and the two
  # endpoints it was configured with is a poor place to exfiltrate from — but it is also how a
  # cluster breaks quietly, so each piece is listed rather than assumed.
  egress:
    # DNS. Without this nothing else resolves, and every other rule looks broken instead.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Peers: Raft, and the cross-shard HTTP proxy.
    - to:
        - podSelector:
            matchLabels:
              {{- include "ecphoria.selectorLabels" . | nindent 14 }}
      ports:
        - { protocol: TCP, port: 8432 }
        - { protocol: TCP, port: 9433 }
    {{- with .Values.networkPolicy.egress.to }}
    # Everything else this deployment actually needs: the embedding provider, object storage, an
    # OIDC issuer's JWKS, a CDC sink. Expressed as whole rules so a selector or an ipBlock both fit.
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
