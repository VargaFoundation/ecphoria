# Default values for Ecphoria Helm chart.

replicaCount: 3

# -- Pod annotations. Use this to trigger rolling restarts on cert/secret rotation, e.g. with
# Stakater Reloader: `reloader.stakater.com/auto: "true"` (cert-manager renews the TLS Secret →
# Reloader restarts the pods → tonic rebuilds its TLS config with the new cert). tonic builds TLS
# once at startup, so cert rotation is a rolling-restart concern, not in-process hot reload.
podAnnotations: {}

# -- Write sharding: deploy N independent Raft groups (StatefulSets), each its own cluster, for
# horizontal write scaling. Disabled by default (single group = `replicaCount` nodes). When enabled,
# each shard is `<fullname>-shard-<i>` with `replicasPerShard` nodes + its own headless service.
sharding:
  enabled: false
  shards: 2
  replicasPerShard: 3

image:
  repository: ghcr.io/vargafoundation/ecphoria
  # -- Image tag. Empty means the chart's appVersion, which is the version this chart was
  # released with — the image it was tested against. The previous default was `latest`, which
  # is a moving tag: it pins nothing, it is refused outright by admission policies that forbid
  # mutable references (Choregos runs one), and it silently upgrades the server under a chart
  # that has not changed.
  tag: ""
  pullPolicy: IfNotPresent

# -- Ecphoria server configuration (maps to ecphoria.toml / env vars)
config:
  storage:
    dataDir: /data
    engine: local
    # -- Object storage: the backup target, and the blob store when `engine: s3`. Leave `bucket`
    # empty to disable both. Credentials come from a Secret you create, or — better where it exists
    # — from the pod's ambient identity (IRSA / Workload Identity / instance profile), in which case
    # leave `existingSecret` empty and there is no key to rotate or leak.
    s3:
      bucket: ""
      region: us-east-1
      endpoint: ""            # e.g. http://minio.storage:9000 for MinIO; empty = AWS
      existingSecret: ""      # Secret holding the credentials
      accessKeyKey: access-key
      secretKeyKey: secret-key
  memory:
    episodic:
      dbPath: /data/episodic.duckdb
    semantic:
      indexDir: /data/vectors
      defaultDimension: 768
    state:
      dbPath: /data/state.db
    # -- Retrieval knobs. 0 = the server's default; set them only with a measurement in hand.
    #
    # `retrievalScanCap` is the one that moves read latency: it is the candidate width per
    # retrieval arm (default 2048). The service benchmark measured 540 ms p95 at 2048 and 24 ms at
    # 512 on a 20k-memory corpus, with no measurable recall cost *at that size* — and the default
    # is 2048 because a much larger corpus does lose recall when the window narrows. Measure with
    # `kb_eval` on your own corpus before changing it. See docs/benchmarks-choregos.md.
    cognition:
      retrievalScanCap: 0
      readPoolSize: 0
      retrievalPool: 0
      decayIntervalSecs: 0      # >0 → the leader forgets decayed memories on this interval
      contradictionReview: false
    # -- What a tenant may write: attribution, and the shape of typed facts. Off by default.
    # See docs/facts.md — start a tenant at `warn`, watch the counter, then switch to `strict`.
    #
    # governance:
    #   factValidation: warn
    #   tenants:
    #     choregos: { requireProvenance: true, factValidation: strict }
    governance:
      requireProvenance: false
      factValidation: ""
      tenants: {}
  gateway:
    listen: "0.0.0.0:8432"
    pgListen: "0.0.0.0:5432"
    grpcListen: "0.0.0.0:9432"
    mcpEnabled: true
    llmProxyEnabled: false
    # Secure by default: with authEnabled=false the pods bind 0.0.0.0 and the server REFUSES to
    # start unless allowInsecure=true. Set authEnabled=true and provide apiKeys (recommended:
    # hashed entries "sha256:<64-hex-of-secret>@tenant:role" — generate with
    # `KEY=$(openssl rand -hex 32); echo -n "$KEY" | sha256sum`), or accept the risk explicitly.
    authEnabled: true
    apiKeys: []
    allowInsecure: false
    # -- Optional gateway tuning. Empty / 0 / false means "use the server default" and emits
    #    no env var. See ecphoria.toml for the semantics of each key.
    maxPgConnections: 0                     # PG-wire connection cap (0 = server default, 256)
    pgHandshakeTimeoutSecs: 0               # close a PG connection that hasn't authenticated (0 = server default, 10)
    corsOrigins: []                         # e.g. ["https://app.example.com"] (default: reflect none)
    rateLimitPerKey: 0                      # requests/sec per API key (0 = unlimited)
    auditDbPath: ""                         # durable audit log, e.g. /data/audit.db
    requireTenant: false                    # reject requests that resolve to no tenant
    webhookRequireSignature: false          # fail-closed: reject webhook sources with no configured secret
    webhookSecrets: []                      # ["github=<hmac>", "slack=<signing-secret>", ...]
    llmCacheSimilarity: false               # semantic (vs exact-match) LLM-proxy response cache
    toolGatewayAllowPrivateNetworks: false  # let the MCP tool-gateway reach RFC1918 (disables SSRF guard)
    cdcSinkUrl: ""                          # outbound CDC: POST every memory + state change to this URL
    publishEnabled: false                   # UNAUTH read-only /public + /public/memories
    publishTenant: "default"                # tenant whose metadata.published=true memories are exposed
    # JWT HS256 signing secret. Prefer a pre-created Secret over a plaintext value:
    #   jwtSecretExistingSecret: ecphoria-jwt   # must contain key "jwt-secret"
    jwtSecret: ""
    jwtSecretExistingSecret: ""
    # OIDC (RS256/JWKS). All fields are plain strings — no file mount required.
    oidc:
      enabled: false
      issuerUrl: ""
      jwksUri: ""
      audience: ""
      roleClaim: "roles"
    # PG-wire TLS (encrypts the password = API key in transit) needs cert+key FILES mounted into the
    # pod. Create a Secret (keys tls.crt/tls.key) and mount it, then set in ecphoria.toml or via
    # a values override with an extra volume — not wired here to avoid shipping a half-configured mount.
  backup:
    # Where backups land inside the bucket.
    s3Prefix: "backups/"
    # Local backups kept under <dataDir>/backups (0 = keep all). The prune runs after each backup.
    maxBackups: 7
    # In-process timer. Off by default — prefer `backup.cronjob` below, which has a result an
    # operator can alert on.
    autoEnabled: false
    intervalHours: 24
  cluster:
    enabled: true
    # nodeId is auto-assigned from StatefulSet ordinal
  embedding:
    # `ollama`, `openai`, `openai_compatible` (any endpoint speaking POST {baseUrl}/embeddings —
    # LiteLLM, vLLM, an Ollama shim), `local`/`fastembed` (in-process ONNX), or `none`.
    provider: ollama
    model: nomic-embed-text
    dimension: 768
    ollamaUrl: "http://ollama:11434"
    # Used by `openai` and `openai_compatible`. Pointing this at a gateway keeps one place where
    # model access is priced and rate-limited.
    openaiBaseUrl: "https://api.openai.com/v1"

# -- Backups. `config.storage.s3.bucket` must be set for anything to leave the cluster.
#
# Two ways to schedule one, and the CronJob is the better one: a Kubernetes job has a result, a
# history, and an alert when it fails, where an in-process timer has a log line. `autoEnabled` is
# kept for deployments without a CronJob controller.
backup:
  cronjob:
    enabled: false
    schedule: "0 2 * * *"
    # `s3` captures a backup and ships it to the bucket, verifying the manifest landed. `local`
    # writes under <dataDir>/backups/ on whichever node answers — useful only with a PVC you snapshot.
    target: s3
    # The admin API key the job authenticates with, from a Secret you create. Required when
    # `config.gateway.authEnabled` (the default).
    apiKeySecret: ""
    apiKeySecretKey: api-key
    # Kubernetes keeps the last N job records; keep enough to see a pattern of failures.
    successfulJobsHistoryLimit: 3
    failedJobsHistoryLimit: 3
    # Never run two backups at once: they would stage the same stores concurrently.
    concurrencyPolicy: Forbid
    # A job that has not started within this window is skipped rather than piling up after an outage.
    startingDeadlineSeconds: 600
    backoffLimit: 2
    activeDeadlineSeconds: 3600
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi

# -- Service configuration
service:
  type: ClusterIP
  httpPort: 8432
  pgPort: 5432
  grpcPort: 9432
  raftPort: 9433

# -- Headless service for StatefulSet peer discovery
headlessService:
  enabled: true

# -- Ingress for the HTTP API + admin UI (/ui). Point a host at the http service port.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # e.g. nginx: nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: ecphoria.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: ecphoria-tls
  #    hosts: [ecphoria.local]

# -- Horizontal Pod Autoscaler. NOTE: Ecphoria nodes form a Raft group — changing the pod count changes
# cluster membership, which the HPA does NOT coordinate. Prefer the operator (ops/operator) for
# cluster-aware scaling; use HPA only for a single-node (replicaCount: 1) or membership-stable setup.
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 75
  # 0 disables the memory metric.
  targetMemoryUtilizationPercentage: 0

# -- Persistent volume for data
persistence:
  enabled: true
  # Encryption at rest = use an ENCRYPTED StorageClass here (the on-disk stores are plaintext; volume
  # encryption is the supported mechanism — see docs/security.md#encryption-at-rest). e.g. an
  # ebs.csi.aws.com class with encrypted:"true" + kmsKeyId, or a GKE pd.csi CMEK class. "" = cluster default.
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# -- Writable /tmp (emptyDir) — required with `securityContext.readOnlyRootFilesystem`, which is on
# by default. A backup stages here before it is uploaded, so size it above one backup's footprint.
tmpVolume:
  sizeLimit: 1Gi

# -- Resource requests and limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 4Gi

# -- Pod-level security context. runAsNonRoot matches the image (uid 1000); fsGroup makes the PVC
# group-writable; seccomp RuntimeDefault.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context: drop all capabilities and block privilege escalation.
# readOnlyRootFilesystem is left false by default — enable it once all writes are confined to
# mounted volumes (data -> PVC) and a writable emptyDir is provided for /tmp (snapshot staging).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # On by default: every write the server makes goes to the PVC (/data) or to the /tmp emptyDir
  # (backup staging). Turn it off only if you mount something that writes elsewhere.
  readOnlyRootFilesystem: true

# -- Liveness and readiness probes
probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    httpGet:
      # /ready returns 503 when the node has no Raft leader or a subsystem is down, so a
      # not-yet-ready pod is kept out of the Service (unlike /health, which is always 200).
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

# -- Pod disruption budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# -- Service monitor for Prometheus
serviceMonitor:
  enabled: false
  interval: 15s
  path: /metrics

# -- PrometheusRule with alerts (no-leader, embedding failures, replication lag, leader flapping,
# p99 latency, agent-run failures). Requires the Prometheus Operator CRDs.
prometheusRule:
  enabled: false
  # Extra labels so your Prometheus Operator's ruleSelector picks it up, e.g. { release: kube-prometheus-stack }.
  labels: {}

# -- NetworkPolicy: lock the PG wire (:5432), gRPC (:9432) and Raft (:9433) ports to intra-fleet
# pod-to-pod traffic (never expose them publicly). The HTTP API (:8432) accepts ingress per
# `httpFrom` (empty = from anywhere). Requires a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  # Ingress sources allowed to reach the HTTP API (:8432). Empty = allow from anywhere. Example:
  # httpFrom:
  #   - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
  httpFrom: []
  # -- Egress. Opt-in, and **default-deny once on**: DNS and peer traffic are always allowed, and
  # anything else must be named here. Get this wrong and the symptom is an embedding provider that
  # times out or a backup that never lands, so turn it on deliberately and list what you use.
  #
  # egress:
  #   enabled: true
  #   to:
  #     - to: [{ podSelector: { matchLabels: { app: ollama } } }]
  #       ports: [{ protocol: TCP, port: 11434 }]
  #     - to: [{ ipBlock: { cidr: 0.0.0.0/0, except: [169.254.169.254/32] } }]  # S3 over HTTPS
  #       ports: [{ protocol: TCP, port: 443 }]
  egress:
    enabled: false
    to: []

# -- Node affinity / tolerations
nodeSelector: {}
tolerations: []
affinity: {}

# -- Ollama sidecar (optional, for local embeddings)
ollama:
  enabled: false
  image: ollama/ollama:latest
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
