openapi: 3.0.3
info:
  title: Ecphoria Context Lake API
  description: >
    REST API for Ecphoria — episodic events, semantic search, agent state, and the bi-temporal
    memory cognition layer. When `auth_enabled`, all `/api/v1/*` routes require
    `Authorization: Bearer <token>` (API key, JWT HS256, or OIDC RS256) and are tenant-scoped.
  version: "0.2.0"
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8432
    description: Local
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
    Scope:
      type: object
      properties:
        tenant_id: { type: string }
        user_id: { type: string }
        agent_id: { type: string }
        session_id: { type: string }
  responses:
    Unauthorized:
      description: Missing/invalid token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: >
        The write does not satisfy the tenant's governance rules — a typed fact that does not match
        its schema, a subject that does not follow its kind's grammar, or a missing provenance where
        the tenant requires one. `code: VALIDATION_FAILED`, and `message` lists every problem at
        once. Off by default; see docs/facts.md.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
paths:
  /health:
    get:
      summary: Liveness + subsystem health
      security: []
      responses: { '200': { description: OK } }
  /ready:
    get:
      summary: Readiness probe
      security: []
      responses: { '200': { description: Ready }, '503': { description: Not ready } }
  /metrics:
    get:
      summary: Prometheus metrics
      security: []
      responses: { '200': { description: Prometheus text format } }
  /api/v1/query:
    post:
      summary: Execute a SELECT-only SQL query (tenant-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { sql: { type: string } }, required: [sql] }
      responses:
        '200':
          description: Rows
          content:
            application/json:
              schema: { type: object, properties: { rows: { type: array, items: { type: object } }, count: { type: integer } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Invalid (non-SELECT) query }
  /api/v1/ingest:
    post:
      summary: Ingest events into episodic memory (auto-embedded)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, events]
              properties:
                source: { type: string }
                events: { type: array, items: { type: object } }
      responses:
        '200': { description: '{ ingested: N }' }
        '422': { description: Batch too large (>10k) }
  /api/v1/webhook/{source}:
    post:
      summary: Webhook ingestion (HMAC-verified if webhook_secret set)
      parameters: [ { name: source, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: Normalized + ingested }, '401': { description: Bad signature } }
  /api/v1/search:
    post:
      summary: Semantic vector search (tenant-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query: { type: string }
                vector: { type: array, items: { type: number } }
                k: { type: integer, default: 5 }
      responses: { '200': { description: Ranked results } }
  /api/v1/embed-and-search:
    post:
      summary: Embed text + search in one call
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { text: { type: string }, k: { type: integer } } } } } }
      responses: { '200': { description: Ranked results } }
  /api/v1/state/{agent_id}/{key}:
    get:
      summary: Get agent state
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Entry }, '404': { description: Not found } }
    put:
      summary: Set agent state (body is the JSON value)
      parameters:
        - { name: agent_id, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: {} } } }
      responses: { '200': { description: '{ version: N }' } }
  /api/v1/memories:
    post:
      summary: Add a memory (dedup / contradiction / importance), or propose one
      description: >
        `?status=pending` proposes instead of writing: the memory is stored `pending`, is invisible
        to retrieval, and waits in the review queue (`GET /api/v1/pending`). Same body either way —
        which of the two a client may do is a permission question, not a different endpoint.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending] }
          description: '`pending` proposes; absent writes.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                subject: { type: string }
                importance: { type: number }
                user_id: { type: string }
                agent_id: { type: string }
                session_id: { type: string }
                metadata:
                  type: object
                  description: >
                    Free-form, with a few keys Ecphoria reads: `kind` promotes the memory to a
                    typed fact (decision, convention, incident, ticket_summary, run_lesson,
                    flaky_test, hotspot, finding, other) with a subject grammar and a per-kind
                    schema; `paths` scopes it to code; `provenance.source` records where it came
                    from. See docs/facts.md.
                project:
                  type: string
                  description: >
                    Project this memory belongs to, within its scope. Facts with the same subject in
                    different projects are distinct, and a later search can narrow to one project.
                valid_from:
                  type: string
                  format: date-time
                  description: >
                    When the fact became true, if that differs from now. A backfill without it reads
                    as if every imported decision was taken today.
      responses:
        '200': { description: 'MemoryAdd (memory + outcome), or { id, status: pending }' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      summary: List active memories in a scope
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
      responses: { '200': { description: '{ memories: [...], count: N }' } }
  /api/v1/memories/by-external-id:
    put:
      summary: Upsert a memory keyed on the caller's own identifier
      description: >
        For importers, connectors and webhooks: a redelivery, a rerun or a restarted sync must all
        converge on ONE memory per source record. The identifier maps to a stable subject
        (`ext:{source}:{external_id}` unless you pass your own), so unchanged content confirms the
        existing memory and changed content supersedes it — the same cognition as any other write,
        with no duplicate row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id, content]
              properties:
                external_id: { type: string, description: "The caller's id: ticket key, commit sha, row id." }
                source: { type: string, default: external, description: 'Which system the id belongs to.' }
                content: { type: string }
                subject: { type: string }
                importance: { type: number }
                metadata: { type: object }
                mem_type: { type: string }
                valid_from: { type: string, format: date-time }
                project: { type: string }
      responses:
        '200': { description: '{ id, outcome, memory }' }
        '400': { description: blank external_id or content }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/context-pack:
    post:
      summary: Everything an agent should know before a task, in one bounded answer
      description: >
        Runs hybrid retrieval, splits the result into memories (what is true) and incidents (what
        went wrong), keeps only the kinds asked for and the memories whose paths overlap the task's
        allowed paths, and cuts the whole thing to a token budget — highest-ranked first, so
        truncation drops the least relevant. `tokens_estimated` is what was kept; `truncated` says
        whether anything was dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, description: 'What the agent is about to do.' }
                paths:
                  type: array
                  items: { type: string }
                  description: >
                    Files the task may touch (globs allowed). A memory that names paths is kept only
                    if one overlaps; a memory that names none is general knowledge and always passes.
                kinds:
                  type: array
                  items: { type: string }
                  description: 'Keep only these `metadata.kind` values. Empty = all.'
                budget_tokens: { type: integer, default: 4000 }
                k: { type: integer, default: 20 }
                project: { type: string }
      responses:
        '200': { description: '{ memories, incidents, related_items, tokens_estimated, truncated, candidates }' }
        '400': { description: blank query }
  /api/v1/pending:
    get:
      summary: The review queue — proposals waiting for a decision, oldest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
      responses: { '200': { description: '{ items: [Memory], count: N }' } }
  /api/v1/pending/{id}/accept:
    post:
      summary: Accept a proposal — it goes through the normal cognition path
      description: >
        The accepted memory supersedes what it contradicts exactly like a direct write. The
        proposal row is retired with the decision recorded. A second accept finds nothing pending.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ accepted: true, memory }' }
        '404': { description: not a pending proposal of this tenant }
  /api/v1/pending/{id}/reject:
    post:
      summary: Reject a proposal — kept, expired, with the judgement recorded
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{ rejected: true, id }' }
        '404': { description: not a pending proposal of this tenant }
  /api/v1/memories/batch:
    post:
      summary: Bulk-add memories (same cognition, batched I/O — ~4.8x faster than a loop)
      description: >
        Applied in order, so a later memory can supersede an earlier one in the same batch.
        Max 10000 per request. In cluster mode this falls back to per-memory Raft replication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memories]
              properties:
                memories:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [content]
                    properties:
                      content: { type: string }
                      subject: { type: string }
                      importance: { type: number }
                      user_id: { type: string }
                      agent_id: { type: string }
                      session_id: { type: string }
                      metadata: { type: object }
                      mem_type: { type: string }
                      project: { type: string }
      responses:
        '200': { description: '{ added: N, memories: [MemoryAdd] }' }
        '400': { description: empty batch, or a memory with blank content }
        '413': { description: more than 10000 memories }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /api/v1/documents:
    post:
      summary: Ingest one Markdown document as independently-addressed sections
      description: >
        Chunks on the heading hierarchy server-side (the removal sweep must compare against what is
        already stored, so a client cannot do it correctly). Re-posting the same path supersedes the
        sections whose text changed, confirms the rest, and expires any that vanished.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, content]
              properties:
                path:
                  type: string
                  description: Stable document identity, normally its repo-relative path
                content: { type: string, description: Raw Markdown }
                valid_from:
                  type: string
                  format: date-time
                  description: Valid-time for this version, e.g. the source commit date. Defaults to now.
                metadata: { type: object }
                target_chars: { type: integer, default: 1500 }
                project: { type: string, description: Project this document belongs to }
                user_id: { type: string }
                agent_id: { type: string }
                session_id: { type: string }
      responses:
        '200': { description: '{ path, chunks, inserted, superseded, confirmed, removed }' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '400': { description: missing path or content }
  /api/v1/documents/prune:
    post:
      summary: Expire the documents of a project that were not in the caller's latest import
      description: >
        The per-document sweep in POST /documents removes sections of a file it was given; a file
        deleted from the source is never mentioned again, and silence cannot be distinguished from
        "not imported this run". An importer that knows the full set closes that loop. Only
        mem_type='chunk' in the project is affected, so facts and promoted tickets are untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, keep_paths]
              properties:
                project: { type: string }
                keep_paths:
                  type: array
                  items: { type: string }
                  minItems: 1
                  description: Every document path just imported. Anything else is expired.
                user_id: { type: string }
      responses:
        '200': { description: '{ project, expired: N }' }
        '400': { description: missing project, or an empty keep_paths (refused — it would expire the whole project) }
  /api/v1/memories/history:
    get:
      summary: Version history of a subject (every version, oldest first)
      description: >
        The by-id variant needs a memory id, which a caller only has after searching. A subject is
        the stable key a client actually holds.
      parameters:
        - { name: subject, in: query, required: true, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: session_id, in: query, schema: { type: string } }
      responses:
        '200': { description: '{ subject, count, memories: [...] }' }
        '400': { description: missing subject }
  /api/v1/memories/search:
    post:
      summary: Hybrid (BM25 + vector) memory search, re-ranked by importance + recency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                k: { type: integer, default: 5 }
                user_id: { type: string }
                project:
                  type: string
                  description: >
                    Restrict to one project. Omit to search every project in the scope at once,
                    fused into a single ranking.
                agent_id: { type: string }
                session_id: { type: string }
      responses: { '200': { description: Ranked memory hits } }
  /api/v1/memories/{id}:
    get:
      summary: Get a memory by id (404 if not in your tenant)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Memory }, '404': { description: Not found } }
    delete:
      summary: Delete a memory by id
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Deleted }, '404': { description: Not found } }
  /api/v1/memories/{id}/history:
    get:
      summary: Bi-temporal history for a memory's subject
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ history: [...], count: N }' } }
  /api/v1/memories/{id}/provenance:
    get:
      summary: "Why do you believe this? — memory + source events + supersession chain"
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ memory, source_events: [...], history: [...] }' } }
  /api/v1/memories/{id}/feedback:
    post:
      summary: Feedback loop — reinforce (helpful) or retire (wrong/obsolete) a memory
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [verdict], properties: { verdict: { type: string, enum: [helpful, wrong, obsolete] } } } } } }
      responses: { '200': { description: '{ verdict, memory }' } }
  /api/v1/memories/watch:
    get:
      summary: WebSocket memory CDC stream (upserted/superseded/expired), tenant-scoped
      responses: { '101': { description: WebSocket upgrade } }
  /api/v1/memories/contradictions:
    get:
      summary: HITL review queue — subjects with more than one active memory
      responses: { '200': { description: '{ contradictions: [{subject, memories}], count }' } }
  /api/v1/memories/contradictions/resolve:
    post:
      summary: Resolve a contradiction — keep one memory, supersede the rest for its subject
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [subject, keep_id], properties: { subject: { type: string }, keep_id: { type: string }, user_id: { type: string }, agent_id: { type: string }, session_id: { type: string } } } } } }
      responses: { '200': { description: '{ kept, superseded }' } }
  /api/v1/memories/grants:
    post:
      summary: "Cross-scope sharing: grant a user read access to another user's memories (tenant-strict)"
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [grantee_user_id, grantor_user_id], properties: { grantee_user_id: { type: string }, grantor_user_id: { type: string } } } } } }
      responses: { '200': { description: '{ id, status: granted }' } }
    get:
      summary: List the grants a user holds (whose memories they may read)
      parameters: [ { name: grantee, in: query, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ grants: [...], count }' } }
  /api/v1/memories/grants/{id}:
    delete:
      summary: Revoke a grant
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ id, revoked }' } }
  /api/v1/memories/link:
    post:
      summary: Add a knowledge-graph edge (src → relation → dst); supersede=true for functional relations
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [src, relation, dst], properties: { src: { type: string }, relation: { type: string }, dst: { type: string }, supersede: { type: boolean } } } } } }
      responses: { '200': { description: ok } }
  /api/v1/memories/graph:
    get:
      summary: Query the memory knowledge graph around an entity (1-hop, or depth>1 subgraph)
      parameters: [ { name: entity, in: query, required: true, schema: { type: string } }, { name: depth, in: query, schema: { type: integer } }, { name: limit, in: query, schema: { type: integer } } ]
      responses: { '200': { description: '{ entity, edges: [...] }' } }
  /api/v1/sessions:
    post:
      summary: Start a conversation session
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [session_id, agent_id], properties: { session_id: { type: string }, agent_id: { type: string }, parent_session_id: { type: string }, metadata: { type: object } } }
      responses: { '200': { description: Started } }
  /api/v1/sessions/{id}/end:
    post:
      summary: End a session
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { summary: { type: string } } } } } }
      responses: { '200': { description: Ended } }
  /api/v1/sessions/{id}/recall:
    get:
      summary: Recall a session's events
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ events: [...], count: N }' } }
  /api/v1/sessions/{id}/distill:
    post:
      summary: Consolidate a closed session's events into memory (LLM-distilled or one memory)
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ session_id, distilled: N, memories: [...] }' } }
  /api/v1/admin/backup:
    post:
      summary: Trigger a full backup (admin)
      description: >
        `target=local` (the default) writes under `<data_dir>/backups/<timestamp>/` and prunes to
        `backup.max_backups`. `target=s3` additionally uploads it under `backup.s3_prefix`, writing
        `manifest.json` LAST — it is the commit record, so a half-written backup has none — then
        re-reads it and checks every object landed. See docs/backup-restore.md.
      parameters:
        - name: target
          in: query
          schema: { type: string, enum: [local, s3], default: local }
      responses:
        '200':
          description: >
            local → { status, path, timestamp, pruned }; s3 → { prefix, timestamp, files, bytes,
            manifest_key, artifacts }
        '400': { description: unknown target }
        '500': { description: backup failed, or an object did not land }
  /api/v1/admin/tenants:
    post:
      summary: Create — or confirm — a tenant (admin)
      description: >
        Tenants are implicit in the stores, so nothing has to be created before writing. This exists
        for provisioning: it answers "does this tenant exist, and may my credential write to it?"
        BEFORE data is sent. Idempotent — an existing tenant reports `created: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                require_provenance: { type: boolean, default: false }
      responses:
        '200': { description: '{ tenant, created, require_provenance }' }
        '400': { description: blank name }
        '403': { description: credential scoped to another tenant }
  /api/v1/admin/tenants/{tenant_id}:
    delete:
      summary: GDPR erasure — delete all data for a tenant across every store (admin)
      parameters: [ { name: tenant_id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Per-store deletion summary } }
  /api/v1/admin/users/{user_id}:
    delete:
      summary: GDPR erasure by user — delete a user's memories + vectors within the token's tenant (admin)
      parameters: [ { name: user_id, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: '{ tenant, user_id, memories_deleted }' } }
  /mcp:
    post:
      summary: MCP JSON-RPC (Streamable HTTP); initialize returns Mcp-Session-Id
      responses: { '200': { description: JSON-RPC response } }
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions with auto-RAG, streaming, tool-use
      responses: { '200': { description: Completion (or text/event-stream if stream=true) } }
  /v1/embeddings:
    post:
      summary: OpenAI-compatible embeddings (drop-in), backed by the configured provider
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [input], properties: { input: { oneOf: [ { type: string }, { type: array, items: { type: string } } ] }, model: { type: string } } } } } }
      responses: { '200': { description: '{ object: list, data: [{embedding: [...]}], model, usage }' } }
  /v1/messages:
    post:
      summary: Native Anthropic Messages API with auto-RAG (passthrough); streaming supported
      responses: { '200': { description: Anthropic message (or text/event-stream if stream=true) } }
