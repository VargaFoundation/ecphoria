[package]
name = "ecphoria-server"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Main server binary for the Ecphoria context lake"

[[bin]]
name = "ecphoria-server"
path = "src/main.rs"

[features]
default = ["agentic", "llm-proxy"]
# The agent runtime end to end: the run ledger and driver in the core, the /runs + /agents routes
# and the downstream tool gateway in the gateway, the Raft apply of run entries in the cluster, and
# this binary's dispatcher loop. Drop it for `ecphoria:memory` — a build that holds facts and
# cannot act on them:
#   cargo build -p ecphoria-server --release --no-default-features
agentic = [
    "ecphoria-core/agentic",
    "ecphoria-gateway/agentic",
    "ecphoria-cluster/agentic",
]
# The OpenAI-/Anthropic-compatible proxy (`/v1/*`) with auto-RAG and the semantic response cache.
llm-proxy = ["ecphoria-gateway/llm-proxy"]
# Passthrough to ecphoria-core's optional local ONNX backends (off by default; each pulls a heavy
# native onnxruntime dep + model download). Build e.g.:
#   cargo build -p ecphoria-server --release --features embed-local
embed-local = ["ecphoria-core/embed-local"]
rerank-local = ["ecphoria-core/rerank-local"]
# Basic in-process image embedding for multimodal attachment search (pure Rust; no ONNX).
embed-image = ["ecphoria-core/embed-image"]
# Export traces to an OTLP collector (Tempo/Grafana/Jaeger) alongside Prometheus metrics. Off by
# default — pulls the opentelemetry SDK + exporter. Build: cargo build -p ecphoria-server --features otlp
otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[dependencies]
ecphoria-core.workspace = true
ecphoria-gateway = { workspace = true, default-features = false }
ecphoria-cluster.workspace = true

tokio.workspace = true
config.workspace = true
serde.workspace = true
toml.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

anyhow.workspace = true
clap.workspace = true
mimalloc.workspace = true

[dev-dependencies]
# Used only by the `otlp`-gated telemetry test to stand up a mock OTLP collector.
axum.workspace = true
