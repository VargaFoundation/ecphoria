[package]
name = "ecphoria-gateway"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Protocol gateway for the Ecphoria context lake"

[features]
default = ["agentic", "llm-proxy"]
# Runs, agents, tools, triggers — the REST surface of the agent runtime, the downstream MCP tool
# gateway, and the MCP tools that drive them. Implies `ecphoria-core/agentic`.
agentic = ["ecphoria-core/agentic", "ecphoria-cluster/agentic"]
# The OpenAI-/Anthropic-compatible proxy (`/v1/chat/completions`, `/v1/embeddings`, `/v1/messages`)
# with auto-RAG and the semantic response cache. Without it the server makes no outbound completion
# call on behalf of a client.
llm-proxy = []

[dependencies]
ecphoria-core = { workspace = true, default-features = false }
ecphoria-cluster = { workspace = true, default-features = false }
openraft.workspace = true

tokio.workspace = true
futures.workspace = true
async-trait.workspace = true

axum.workspace = true
axum-extra.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
reqwest.workspace = true

tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true

pgwire.workspace = true
tokio-rustls.workspace = true
rustls-pemfile.workspace = true

jsonwebtoken.workspace = true
hmac.workspace = true
sha2.workspace = true
duckdb.workspace = true
parking_lot.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true

metrics.workspace = true
metrics-exporter-prometheus.workspace = true

uuid.workspace = true
chrono.workspace = true
bytes.workspace = true
dashmap.workspace = true
usearch.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protobuf-src.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
tower = { workspace = true, features = ["util"] }
tokio-postgres = "0.7"
tempfile.workspace = true
