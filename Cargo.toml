[workspace]
resolver = "2"
members = [
    "crates/ecphoria-core",
    "crates/ecphoria-gateway",
    "crates/ecphoria-cluster",
    "crates/ecphoria-cli",
    "ecphoria-server",
    "tests/integration",
]
# The Python binding is a cdylib on its own workspace (like ops/operator) — built via maturin, not
# part of `cargo build --workspace`.
exclude = ["bindings/python"]

[workspace.package]
version = "0.2.5"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/VargaFoundation/ecphoria"
description = "The open-source agentic memory platform for AI agents"

[workspace.dependencies]
# Internal crates
# `default-features = false` is spelled out so members can opt out (the gateway does, for the
# memory-only build); Cargo ignores a member's `default-features` otherwise.
ecphoria-core = { path = "crates/ecphoria-core", default-features = false }
ecphoria-gateway = { path = "crates/ecphoria-gateway", default-features = false }
ecphoria-cluster = { path = "crates/ecphoria-cluster", default-features = false }
ecphoria-cli = { path = "crates/ecphoria-cli" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP / Web
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout"] }
hyper = { version = "1" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# gRPC
# tonic 0.14 split prost support out of the core crate: the runtime codec lives in `tonic-prost`
# and the code generator in `tonic-prost-build`. The TLS feature also split by crypto provider —
# `tls-ring` matches the provider the rest of the workspace uses (rustls/ring).
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = { version = "0.14" }
prost = { version = "0.14" }
prost-types = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
protobuf-src = { version = "2" }

# PostgreSQL wire protocol
pgwire = { version = "0.41" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2" }

# Database / Storage
# `json` en plus de `bundled` : l'extension est alors liée statiquement au binaire. Sans
# elle, DuckDB essaie de la charger dynamiquement au premier `CREATE TABLE`, et sur musl
# (l'image Alpine) le chargement dynamique n'existe pas — le serveur paniquait au
# démarrage sur « Extension Autoloading Error … Dynamic loading not supported ». Les
# images publiées n'auraient jamais démarré.
duckdb = { version = "1", features = ["bundled", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Vector search
usearch = { version = "2" }

# Object storage (S3/MinIO)
# `rustls` (the default) pulls the SDK's *legacy* hyper-0.14 client alongside the modern one,
# which drags in h2 0.3 and rustls 0.21 — three RUSTSEC advisories for a code path nothing uses.
# The `default-https-client` feature is the hyper-1 client on its own.
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso", "behavior-version-latest"] }

# Consensus
openraft = { version = "0.9", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rmp-serde = { version = "1" }
toml = { version = "1" }

# Configuration
config = { version = "0.14" }

# Error handling
thiserror = { version = "2" }
anyhow = { version = "1" }

# Observability
notify = { version = "6" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = { version = "0.24" }
metrics-exporter-prometheus = { version = "0.16" }
# Optional OTLP trace export (feature `otlp`), via the HTTP/protobuf exporter so it doesn't couple to
# the Raft tonic version. Off by default — the exporter + SDK are a non-trivial dep tree.
opentelemetry = { version = "0.27" }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
tracing-opentelemetry = { version = "0.28" }

# Auth
jsonwebtoken = { version = "9" }
hmac = { version = "0.13" }
sha2 = { version = "0.11" }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = { version = "1" }
futures = { version = "0.3" }
async-trait = { version = "0.1" }
parking_lot = { version = "0.12" }
dashmap = { version = "6" }
rand = { version = "0.10" }

# Regex — fact-subject grammars and the small JSON Schema validator (`memory::schema`).
# Already in the tree transitively; declared here so the version is pinned in one place.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }

# SQL parsing (visitor feature: AST rewriting for tenant scoping)
sqlparser = { version = "0.53", features = ["visitor"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }
rustyline = { version = "15" }

# Global allocator — mimalloc avoids the multi-threaded slowdown of the musl allocator on
# allocation-heavy workloads (DuckDB), measurable on ingest/query p95.
mimalloc = { version = "0.1", default-features = false }

# Testing
tempfile = { version = "3" }
criterion = { version = "0.5", features = ["async_tokio"] }
proptest = { version = "1" }

[profile.dev]
# Lighter debug info: keeps file:line in backtraces (panics, RUST_BACKTRACE),
# but drops full DWARF variable info. Roughly halves the size of target/ for a
# workspace with heavy native deps (duckdb/protobuf-src/aws-sdk). Set to "full"
# locally if you need step-through variable inspection in a debugger.
debug = "line-tables-only"
# Unpack split debug info into separate .dwo/.o files so incremental rebuilds don't rewrite
# multi-hundred-MB binaries wholesale (and `strip`/clean reclaim them cleanly).
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
# Dependencies (duckdb bundled, onnxruntime via fastembed, aws-sdk, protobuf) are the bulk of
# target/. They almost never need debugging, so drop their debug info entirely — this is the single
# biggest lever against target/ growth. Workspace crates keep line-tables-only (above) so your own
# backtraces still show file:line.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
