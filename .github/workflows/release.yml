name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Top-level is least-privilege; jobs that sign/attest widen their own scope below.
permissions:
  contents: read

jobs:
  docker:
    name: Build ${{ matrix.variant }} (${{ matrix.platform }})
    # Chaque architecture sur un runner natif. `ubuntu-24.04-arm` est gratuit pour un dépôt
    # public, et c'est la seule façon tenable de construire arm64 ici : sous émulation QEMU,
    # `protobuf-src` compile abseil en C++ et la construction de v0.2.2 tournait encore après
    # 3 h 35 sans finir, pour une limite de job à 6 h.
    #
    # Chaque job pousse **par digest**, sans tag. Les tags sont posés ensuite par `manifest`,
    # sur la liste de manifestes qui réunit les deux architectures — un tag ne peut pas être
    # écrit deux fois par deux jobs qui s'ignorent.
    runs-on: ${{ matrix.platform == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      IMAGE: ghcr.io/vargafoundation/ecphoria
    strategy:
      fail-fast: false
      matrix:
        # Produit croisé : quatre constructions. `variant` doit être une dimension et non un
        # `include`, sinon les deux entrées `include` se recouvrent — elles ajouteraient
        # toutes deux la même clé à toutes les combinaisons, et la seconde gagnerait.
        variant: [full, memory]
        platform: [amd64, arm64]
        include:
          # Everything: memory substrate + agent runtime + LLM proxy.
          - variant: full
            features: ""
          # Memory only: no run ledger, no agent driver, no outbound completion call. Same image
          # shape, a strictly smaller thing to reason about when the job is to hold facts.
          - variant: memory
            features: "--no-default-features"
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.platform }}
          build-args: |
            FEATURES=${{ matrix.features }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Par variante **et** par architecture : les quatre constructions ne partagent aucun
          # artefact compilé, et un cache commun ne ferait que se piétiner.
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}

      - name: Déposer le digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Manifeste, signature et SBOM (${{ matrix.variant }})
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/vargafoundation/ecphoria
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            suffix: ""
          - variant: memory
            suffix: "-memory"
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (GitHub OIDC) + provenance attestation
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # `{{is_default_branch}}` is false on a tag push: the helper strips `refs/heads/`
            # from the ref and compares the result to the default branch name, so on
            # `refs/tags/v0.2.0` it compares that whole string and gets false. This workflow
            # only ever runs on tags — it therefore never produced `latest` at all, while the
            # chart's default `image.tag` is `latest` and docs/editions.md tells people to
            # pull `:latest-memory`. Both pointed at a tag that could not exist.
            #
            # A final release moves `latest`; a pre-release (`v0.2.0-rc.1`, which the trigger
            # glob also matches) must not.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true

      - name: Assembler la liste de manifestes
        working-directory: /tmp/digests
        run: |
          # Le découpage en mots est ici l'effet recherché : `jq` produit la liste des `-t`,
          # `printf` celle des références par digest. Les quoter passerait un seul argument
          # géant à `imagetools`.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Relever le digest du manifeste
        id: manifest
        run: |
          echo "digest=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)" >> "$GITHUB_OUTPUT"

      # Keyless signature (Sigstore/Fulcio via GitHub OIDC) over the pushed image by digest.
      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # SLSA build provenance attestation, attached to the image in GHCR.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      # SBOM (SPDX JSON) generated from the image and attached as a signed cosign attestation.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.manifest.outputs.digest }}
          format: spdx-json
          output-file: ecphoria-sbom-${{ matrix.variant }}.spdx.json

      - name: Attest SBOM with cosign
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: cosign attest --yes --predicate "ecphoria-sbom-${VARIANT}.spdx.json" --type spdxjson "${IMAGE}@${DIGEST}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: ecphoria-sbom-${{ matrix.variant }}
          path: ecphoria-sbom-${{ matrix.variant }}.spdx.json

  operator-docker:
    name: Build & Push operator image
    env:
      IMAGE: ghcr.io/vargafoundation/ecphoria-operator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # `{{is_default_branch}}` is false on a tag push: the helper strips `refs/heads/`
            # from the ref and compares the result to the default branch name, so on
            # `refs/tags/v0.2.0` it compares that whole string and gets false. This workflow
            # only ever runs on tags — it therefore never produced `latest` at all, while the
            # chart's default `image.tag` is `latest` and docs/editions.md tells people to
            # pull `:latest-memory`. Both pointed at a tag that could not exist.
            #
            # A final release moves `latest`; a pre-release (`v0.2.0-rc.1`, which the trigger
            # glob also matches) must not.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: ops/operator
          # amd64 seul pour l'opérateur, contrairement au serveur. Il n'est pas concerné par
          # ce qui a rendu l'émulation intenable côté serveur (`protobuf-src` compilant abseil
          # en C++) : sous QEMU, sa construction arm64 passait, en ~45 minutes. Le découpage
          # par architecture et l'assemblage de manifeste appliqués au serveur lui rendraient
          # le même service ; c'est trois fois le même YAML pour un contrôleur que personne
          # n'a encore demandé en arm64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign operator image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Attest operator build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: write # create the GitHub Release + upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          pip install git-cliff || cargo install git-cliff
          git cliff --latest --strip header > RELEASE_NOTES.md

      # Attach both images' SBOMs to the GitHub Release — the docker job is a matrix (full,
      # memory), so each leg uploads its own artifact and `merge-multiple` flattens them here.
      - name: Download SBOMs
        uses: actions/download-artifact@v8
        with:
          pattern: ecphoria-sbom-*
          merge-multiple: true
        continue-on-error: true

      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ecphoria-sbom-*.spdx.json

  publish-python:
    name: Publish Python SDK (PyPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        working-directory: sdk/python
        env:
          # Add a PyPI API token as the repo secret PYPI_API_TOKEN to enable publishing.
          TWINE_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_TOKEN" ]; then
            echo "PYPI_API_TOKEN not set — skipping PyPI publish."; exit 0
          fi
          python -m pip install --upgrade twine
          python -m twine upload dist/* -u __token__ -p "$TWINE_TOKEN"

  publish-npm:
    name: Publish TypeScript SDK (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Install deps (builds via prepublishOnly on publish)
        working-directory: sdk/typescript
        run: npm install
      - name: Publish to npm
        working-directory: sdk/typescript
        env:
          # Add an npm automation token as the repo secret NPM_TOKEN to enable publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping npm publish."; exit 0
          fi
          npm publish --access public

  # The Go SDK (module github.com/VargaFoundation/ecphoria/sdk/go) is pull-based: `go get` resolves it
  # from the pushed tag via the Go module proxy / pkg.go.dev — no publish step needed.
