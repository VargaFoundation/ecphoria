name: Benchmarks

on:
  pull_request:
    branches: [main]
  # The profile bench is slow (it builds a corpus before it measures anything), so it runs on a
  # schedule and on demand rather than on every PR.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: Criterion benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: Mozilla-Actions/sccache-action@v0.0.6

      - name: Run benchmarks
        run: cargo bench -p ecphoria-core -- --output-format bencher | tee bench-output.txt
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Download previous benchmark results
        uses: actions/cache@v4
        with:
          path: ./bench-cache
          key: bench-${{ runner.os }}-${{ github.base_ref }}
          restore-keys: |
            bench-${{ runner.os }}-main

      - name: Compare and comment on PR
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          external-data-json-path: ./bench-cache/benchmark-data.json
          comment-on-alert: true
          alert-threshold: "130%"
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: true
          summary-always: true

  profile:
    name: Choregos profile (service under load)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A quarter of the production profile: a GitHub runner has 2–4 cores, so the absolute numbers
      # mean nothing next to a workstation's. What this catches is a *regression* — a change that
      # makes retrieval several times slower shows up here whatever the hardware, which is why the
      # gate is set well above the measured baseline rather than at it.
      - name: Run the profile bench
        env:
          BENCH_FACTS: "5000"
          BENCH_EVENTS: "50000"
          BENCH_SECONDS: "30"
          BENCH_READS_PER_SEC: "20"
          BENCH_WRITES_PER_SEC: "2"
          # Deliberately loose. Nobody has measured this profile on a 2-core hosted runner yet, so
          # a tight gate here would be a guess that fails nightly for its own reasons. The first
          # green runs establish the real baseline; tighten it then, against numbers rather than
          # against an estimate. What this catches meanwhile is a several-fold regression, which is
          # the failure worth waking up to.
          BENCH_P95_MS: "5000"
        run: cargo run --release -p ecphoria-core --example choregos_bench
