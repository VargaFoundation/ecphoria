name: Benchmarks

on:
  pull_request:
    branches: [main]
  # Also on `main`, and this is what makes the comparison mean anything. A cache written by a
  # pull request lives in that pull request's own scope and no other run can read it; only a
  # cache written on the default branch is visible to every branch. Without this trigger, every
  # pull request compared its measurements against an empty baseline — the 130% alert could
  # never fire, whatever a change did to the numbers.
  push:
    branches: [main]
  # The profile bench is slow (it builds a corpus before it measures anything), so it runs on a
  # schedule and on demand rather than on every PR.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    name: Criterion benchmarks
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: Mozilla-Actions/sccache-action@v0.0.6

      - name: Enable sccache only if the cache service answers
        # Same guard as `ci.yml`: when the Actions cache is unavailable — which is the normal
        # state on a Dependabot pull request, where the cache is read-only — `sccache` fails to
        # start its server, and every `cargo` invocation using it as RUSTC_WRAPPER dies. A
        # compiler cache is an optimisation: losing it should slow the benchmark, not fail it.
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          if sccache --start-server >/dev/null 2>&1; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::sccache unavailable — benchmarking without a compiler cache"
          fi

      - name: Run benchmarks
        # Two things this line got wrong, one hiding the other.
        #
        # `--bench engine` rather than the whole package: `--output-format bencher` goes to every
        # bench target of the crate, and the `--lib` target runs under libtest, which rejects the
        # flag outright (`error: Unrecognized option: 'output-format'`). Only `benches/engine.rs`
        # is `harness = false`. This job has therefore never produced a measurement.
        #
        # `pipefail` is why that is visible at all: without it the exit status is `tee`'s, so a
        # `cargo bench` that never ran leaves an empty `bench-output.txt` and a green step, and
        # the failure surfaces two steps later as "No benchmark result was found" — which reads
        # like a problem with the comparison rather than with the command above it.
        shell: bash
        run: |
          set -o pipefail
          cargo bench -p ecphoria-core --bench engine -- --output-format bencher | tee bench-output.txt

      # Read and write are split on purpose. `actions/cache` skips saving on an exact key hit,
      # so a single fixed key would freeze the baseline at whatever the first run measured and
      # never move again. Pull requests only read; `main` writes a new entry per commit, and the
      # prefix restore picks up the most recent one.
      - name: Baseline measured on `main`
        uses: actions/cache/restore@v4
        with:
          path: ./bench-cache
          key: bench-${{ runner.os }}-main-
          restore-keys: |
            bench-${{ runner.os }}-main-

      - name: Compare and comment on PR
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: bench-output.txt
          external-data-json-path: ./bench-cache/benchmark-data.json
          # Dependabot's GITHUB_TOKEN is read-only whatever this workflow declares, so a comment
          # is a guaranteed 403 — and the action treats that as a failure. The measurement still
          # runs and still lands in the job summary; only the comment is skipped.
          comment-on-alert: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
          alert-threshold: "130%"
          fail-on-alert: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          comment-always: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
          summary-always: true

      - name: Publish the new baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ./bench-cache
          key: bench-${{ runner.os }}-main-${{ github.sha }}

  profile:
    name: Choregos profile (service under load)
    # Explicitly the schedule and manual runs, not "anything that is not a pull request":
    # adding the `push` trigger for the Criterion baseline would otherwise have signed this
    # slow job up for every commit on `main` as a side effect.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A quarter of the production profile: a GitHub runner has 2–4 cores, so the absolute numbers
      # mean nothing next to a workstation's. What this catches is a *regression* — a change that
      # makes retrieval several times slower shows up here whatever the hardware, which is why the
      # gate is set well above the measured baseline rather than at it.
      - name: Run the profile bench
        env:
          BENCH_FACTS: "5000"
          BENCH_EVENTS: "50000"
          BENCH_SECONDS: "30"
          BENCH_READS_PER_SEC: "20"
          BENCH_WRITES_PER_SEC: "2"
          # Deliberately loose. Nobody has measured this profile on a 2-core hosted runner yet, so
          # a tight gate here would be a guess that fails nightly for its own reasons. The first
          # green runs establish the real baseline; tighten it then, against numbers rather than
          # against an estimate. What this catches meanwhile is a several-fold regression, which is
          # the failure worth waking up to.
          BENCH_P95_MS: "5000"
        run: cargo run --release -p ecphoria-core --example choregos_bench
